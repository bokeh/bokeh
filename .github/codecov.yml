flag_management:
  default_rules:
    # Preserve coverage from suites skipped by CI path filters.
    carryforward: true

coverage:
  range: 85..95
  status:
    project:
      bokeh:
        target: auto
        threshold: 1%
        flags:
          - integration
          - minimal
          - notebook
          - unit
        paths:
          - "src"

comment:
  layout: "diff"
  behavior: once
