name: BokehJS-CI

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    outputs:
      bokehjs: ${{ steps.full.outputs.selected == 'true' || steps.filter.outputs.bokehjs == 'true' }}
      full: ${{ steps.full.outputs.selected == 'true' }}
      groups: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classify changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          base: ${{ github.event.pull_request.base.sha }}
          token: ''
          predicate-quantifier: some-with-excludes
          filters: .github/ci-path-filters.yml

      - name: Select full CI
        id: full
        if: >-
          github.event_name != 'pull_request' ||
          steps.filter.outputs.full == 'true' ||
          steps.filter.outputs.ci == 'true'
        run: echo "selected=true" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.bokehjs == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'bokehjs/package-lock.json'

      - name: Upgrade npm
        shell: bash
        run: |
          npm install -g npm

      - name: Install dependencies
        working-directory: ./bokehjs
        shell: bash
        run: |
          npm ci --no-progress

      - name: List installed software
        working-directory: ./bokehjs
        shell: bash
        run: |
          node make test:info
          npm list

      - name: Build bokehjs
        working-directory: ./bokehjs
        shell: bash
        run: |
          node make build

      - name: Package bokehjs
        working-directory: ./bokehjs
        shell: bash
        run: |
          node make pack

      - name: Run tests
        working-directory: ./bokehjs
        shell: bash
        run: |
          node make test:codebase test:defaults test:unit

      - name: Check repository status
        if: success() || failure()
        shell: bash
        run: |
          OUTPUT=$(git status --short bokehjs -- ':!bokehjs/test/baselines')
          if [[ -n "$OUTPUT" ]]; then echo "$OUTPUT"; exit 1; fi

      - name: Upload package
        if: runner.os == 'Linux' && (success() || failure())
        uses: actions/upload-artifact@v6
        with:
          name: bokehjs-package
          path: bokehjs/build/dist/bokeh-bokehjs-*.tgz

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.bokehjs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: 'bokehjs/package-lock.json'

      - name: Upgrade npm
        run: npm install -g npm

      - name: Install dependencies
        working-directory: ./bokehjs
        run: npm ci --no-progress --no-audit --no-fund

      - name: Lint BokehJS
        working-directory: ./bokehjs
        run: node make lint

  baseline-test:
    needs: changes
    if: needs.changes.outputs.bokehjs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Run baseline tests
        run: node ./bokehjs/test/run-baseline-tests.mjs

      - name: Collect results
        if: success() || failure()
        shell: bash
        run: |
          SRC="bokehjs/test/baselines/linux"
          DST="bokehjs-report/${SRC}"
          mkdir -p "${DST}"
          if [[ -e "${SRC}/report.json" ]];
          then
            cp "${SRC}"/report.{json,out} "${DST}"
            while IFS= read -r -d '' path; do
              cp --parents "$path" bokehjs-report
            done < <(git ls-files --modified --others --exclude-standard -z -- "${SRC}/*.blf" "${SRC}/*.png")
          fi

      - name: Upload report
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: bokehjs-report
          path: bokehjs-report

  result:
    name: BokehJS-CI / result
    if: ${{ always() }}
    needs: [changes, test, lint, baseline-test]
    runs-on: ubuntu-24.04

    steps:
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            (if .changes.outputs.bokehjs == "true"
             then .test.result == "success" and
                  .lint.result == "success" and
                  ."baseline-test".result == "success"
             else .test.result == "skipped" and
                  .lint.result == "skipped" and
                  ."baseline-test".result == "skipped"
             end)
          ' <<<"$RESULTS"
