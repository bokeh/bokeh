name: Release - Build
run-name: Release - Build ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build a release for (e.g. 3.7.0, 3.6.0.dev3)"
        required: true

defaults:
  run:
    shell: bash -l {0}

jobs:

  build:
    runs-on: ubuntu-24.04
    environment:
      name: upload-deployment
      url: https://cdn.bokeh.org/
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check Maintainer
        uses: tspascoal/get-user-teams-membership@v4
        id: checkUserMember
        with:
          username: ${{ github.actor }}
          team: 'release-manager'
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Maintainer confirmed
        if: ${{ steps.checkUserMember.outputs.isTeamMember == 'true' }}
        env:
          BOKEH_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo
          echo "User is authorized to build releases, proceeding with release build for $BOKEH_VERSION"
          git config --global user.email "info@bokeh.org"
          git config --global user.name "${{github.actor}}"
          exit 0
      - name: Maintainer not detected
        if: ${{ steps.checkUserMember.outputs.isTeamMember == 'false' }}
        run: |
          echo
          echo "User is NOT authorized to build releases, aborting..."
          echo
          echo "Please contact @bokeh/core about conducting releases."
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          mamba-version: "*"
          activate-environment: bk-release-build
          environment-file: conda/environment-release-build.yml

      - name: List installed software
        run: |
          echo "node $(node --version)"
          echo "npm $(npm --version)"
          conda info
          conda list

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_BUILD_ROLE_ARN }}
          role-session-name: bokeh-release-build-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Build Release Artifacts
        env:
          BOKEH_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m release build-artifacts "$BOKEH_VERSION"

      - name: Upload Deployment Assets
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          BOKEH_VERSION: ${{ github.event.inputs.version }}
        run: python -m release upload-deployment "$BOKEH_VERSION"

      - name: Update Release Repository
        env:
          BOKEH_VERSION: ${{ github.event.inputs.version }}
        run: python -m release update-release-repository "$BOKEH_VERSION"
