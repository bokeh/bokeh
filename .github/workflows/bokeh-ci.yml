name: Bokeh-CI

# Standard testing for faster feedback on common configurations
# Runs unit tests on latest Python across all platforms, everything else on Linux only

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history to get proper build version

      - name: Build Bokeh and Bokeh.js
        uses: ./.github/workflows/composite/build

  codebase:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Run codebase checks on all platforms
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      # Required for codebase tests that check file formatting (line endings, whitespace, etc).
      - name: Configure line endings in git
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: test-py312
          source-tree: 'keep'

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: test-py312

      - name: Run codebase checks
        run: pytest --color=yes --durations=20 --durations-min=1 tests/codebase

      - name: Run tools tests
        run: pytest --color=yes --durations=20 --durations-min=1 tests/tools

  typing:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.12'
            environment: test-py312
          - os: ubuntu-24.04
            python-version: '3.14'
            environment: test-py314

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: ${{ matrix.environment }}
          source-tree: 'keep'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: ${{ matrix.environment }}

      - parallel:
        - name: Check library types with mypy
          run: |
            mypy --version
            mypy --no-sqlite-cache --show-traceback
        - name: Check types in examples with mypy
          run: |
            mypy --version
            mypy --no-sqlite-cache --show-traceback --config-file examples/mypy.cfg examples/basic/scatters/color_scatter.py
        - name: Check library types with pyright
          run: |
            pyright --version && pyright

  examples:
    needs: build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Examples: Linux only (Chrome/Chromium dependency)
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: test-py314
          source-tree: 'delete'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: Install Playwright browser
        run: playwright install chromium

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: test-py314

      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: pytest -s -v --color=yes --tb line -n logical --durations=20 --durations-min=1 tests/test_examples.py

      - name: Collect results
        if: always()
        env:
          DST: "examples-report"
        run: |
          mkdir -p "$DST"
          cp examples-report.html "$DST"
          while IFS= read -r image; do
            cp --parents "$image" "$DST"
          done < .images-list

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: examples-report
          path: examples-report

  unit-test:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Unit tests: Latest Python (3.14) on all platforms
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.14']
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: test-py314
          source-tree: 'delete'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: test-py314

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run unit tests
        uses: ./.github/workflows/composite/run-unit-tests
        with:
          collect-coverage: ${{ runner.os != 'Windows' }}

  minimal-deps:
    needs: build
    runs-on: ubuntu-24.04

    env:
      OS: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: minimal
          source-tree: 'delete'

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: minimal

      - name: Run dependency tests
        uses: ./.github/workflows/composite/run-deps-tests
        with:
          dep-type: 'minimal'

  core-deps:
    needs: build
    runs-on: ubuntu-24.04

    env:
      OS: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: core
          source-tree: 'delete'

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: core

      - name: Run dependency tests
        uses: ./.github/workflows/composite/run-deps-tests
        with:
          dep-type: 'core'

  documentation:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Documentation: Linux only
        os: [ubuntu-24.04]
        # Build only on the most recent version of Python, so that documentation
        # and included examples can utilize newest available syntax and standard APIs.
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          environment: test-py314
          source-tree: 'delete'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          environment: test-py314

      - name: Build docs
        run: pixi run --locked --environment test-py314 docs

      - name: Upload docs
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/bokeh/docs-html.tgz
