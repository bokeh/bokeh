name: Build

description: 'Build Bokeh and Bokeh.js for testing'

runs:
  using: "composite"
  steps:
    # Build conda cache key (24-hour expiration via date)
    # To manually reset cache, increment the version number (v1, v2, etc.)
    # We cache the package directory (pkgs/) instead of individual environments
    # to allow sharing packages across different Python versions on the same OS.
    # This dramatically reduces cache size (3-6 GB total vs 10+ GB with per-env caching).
    - name: Build conda cache key
      id: conda-cache-key
      shell: bash
      run: |
        TODAY=$(date -u '+%Y%m%d')
        CACHE_KEY="conda-pkgs-v1-${{ runner.os }}-${{ runner.arch }}-${TODAY}"
        echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

    # Cache conda packages (shared across all environments on this OS)
    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ steps.conda-cache-key.outputs.key }}
      id: cache

    # Remove nodejs from conda environment to avoid duplicate installation
    # We'll install Node.js via setup-node instead for better npm caching
    - name: Filter nodejs from environment file
      shell: bash
      run: grep -v '^\s*-\s*nodejs\b' conda/environment-build.yml > conda/environment-build-no-nodejs.yml

    # Setup Miniforge and create environment from filtered file
    # This creates and activates the bk-test environment with all packages
    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        mamba-version: "*"
        activate-environment: bk-test
        environment-file: conda/environment-build-no-nodejs.yml
        conda-remove-defaults: true
        run-post: ${{ runner.os != 'Windows' }}

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'bokehjs/package-lock.json'

    - name: Install node modules
      shell: bash -l {0}
      run: bash scripts/ci/install_node_modules.sh

    - name: Build BokehJS
      working-directory: ./bokehjs
      shell: bash -l {0}
      run: node make build

    - name: Build pip packages
      shell: bash -l {0}
      env:
        BOKEHJS_ACTION: 'install'
      run: python -m build .

    - name: Verify pip install from sdist
      shell: bash -l {0}
      run: bash scripts/ci/verify_pip_install_from_sdist.sh

    - name: Verify pip install using sdist
      shell: bash -l {0}
      run: bash scripts/ci/verify_pip_install_using_sdist.sh

    - name: Verify pip install using wheel
      shell: bash -l {0}
      run: bash scripts/ci/verify_pip_install_using_wheel.sh

    - name: Build conda package
      shell: bash -l {0}
      run: bash scripts/ci/build_conda_package.sh

    - name: Verify conda install
      shell: bash -l {0}
      run: bash scripts/ci/verify_conda_install.sh

    - name: Upload wheel package
      uses: actions/upload-artifact@v4
      with:
        name: wheel-package
        path: dist/bokeh-*-py3-none-any.whl

    - name: Upload bokehjs package
      uses: actions/upload-artifact@v4
      with:
        name: bokehjs-package
        path: bokehjs/build/dist/bokeh-bokehjs-*.tgz
