name: Build

description: 'Build Bokeh and Bokeh.js for testing'

runs:
  using: "composite"
  steps:
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: build
        activate-environment: build
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'branch-')) }}

    - name: Build BokehJS
      shell: bash --noprofile --norc -eo pipefail {0}
      run: pixi run --locked --environment build build-js

    - name: Build first-party Jupyter extension
      shell: bash --noprofile --norc -eo pipefail {0}
      run: pixi run --locked --environment build jupyter-verify

    - name: Build pip packages
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        BOKEHJS_ACTION: 'install'
      run: pixi run --locked --environment build python -m build .

    - name: Verify Jupyter frontend sources are not packaged
      shell: bash -l {0}
      run: |
        python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('bokeh-*.whl')); assert not any(path.startswith('bokeh/jupyter/frontend/') for path in ZipFile(wheel).namelist())"
        python -c "from pathlib import Path; import tarfile; archive = next(Path('dist').glob('bokeh-*.tar.gz')); assert not any('/src/bokeh/jupyter/frontend/' in path for path in tarfile.open(archive).getnames())"

    - name: Verify pip install from sdist
      shell: bash --noprofile --norc -eo pipefail {0}
      run: bash tools/ci/verify_pip_install_from_sdist.sh

    - name: Verify pip install using sdist
      shell: bash --noprofile --norc -eo pipefail {0}
      run: bash tools/ci/verify_pip_install_using_sdist.sh

    - name: Verify pip install using wheel
      shell: bash --noprofile --norc -eo pipefail {0}
      run: bash tools/ci/verify_pip_install_using_wheel.sh

    - name: Upload wheel package
      uses: actions/upload-artifact@v6
      with:
        name: wheel-package
        path: dist/bokeh-*-py3-none-any.whl

    - name: Upload bokehjs package
      uses: actions/upload-artifact@v6
      with:
        name: bokehjs-package
        path: bokehjs/build/dist/bokeh-bokehjs-*.tgz
