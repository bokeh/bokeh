name: 'List Installed Software'

description: 'List the Pixi environment and Node.js/npm versions'

inputs:
  environment:
    description: 'Pixi environment to list'
    required: true
  include-chromium:
    description: 'Whether to include chromium version in output'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: List installed software
      shell: bash --noprofile --norc -eo pipefail {0}
      run: |
        pixi info
        pixi list --locked --environment "${{ inputs.environment }}"
        echo "python $(python --version)"
        echo "node $(node --version)"
        echo "npm $(npm --version)"
        if [[ "${{ inputs.include-chromium }}" == "true" ]]; then
          chromium --version || echo "chromium not found"
        fi
