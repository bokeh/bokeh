name: 'Run Dependency Tests'

description: 'Run tests with minimal or core dependencies'

inputs:
  dep-type:
    description: 'Type of dependency test (minimal or core)'
    required: true

runs:
  using: composite
  steps:
    - name: Run tests
      shell: bash --noprofile --norc -eo pipefail {0}
      run: |
        export BOKEH_TEST_DIAGNOSTICS_DIR="${{ runner.temp }}/pytest-hangs"
        COLOR="--color=yes"
        COVERAGE="--cov=bokeh --cov-report=xml"
        DURATIONS="--durations=20 --durations-min=1"
        # Dependency jobs verify compatibility; unit and free-threaded jobs cover concurrency.
        MARKERS="not sampledata and not free_threading"
        PARALLEL="-n logical --dist=loadgroup"
        POLICY="--last-failed --last-failed-no-failures none"
        pytest -m "$MARKERS" $COLOR $COVERAGE $DURATIONS $PARALLEL tests/unit || pytest -m "$MARKERS" $COLOR $DURATIONS $PARALLEL $POLICY tests/unit

    - name: Log current tests
      if: always()
      shell: bash --noprofile --norc -eo pipefail {0}
      run: |
        shopt -s nullglob
        for logfile in "${{ runner.temp }}/pytest-hangs/"*.current.txt; do
          echo "::group::$(basename "$logfile")"
          cat "$logfile"
          echo "::endgroup::"
        done

    - name: Upload test hang diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pytest-hangs-${{ runner.os }}-${{ inputs.dep-type }}-${{ github.job }}-${{ strategy.job-index }}
        path: ${{ runner.temp }}/pytest-hangs
        if-no-files-found: ignore

    - name: Upload code coverage
      uses: codecov/codecov-action@v7
      if: success() || failure()
      with:
        use_oidc: true
        env_vars: OS
        flags: unit,${{ inputs.dep-type }}
        verbose: true
