name: 'Run Unit Tests'

description: 'Run Bokeh unit tests with coverage'

inputs:
  coverage-flags:
    description: 'Codecov flags (comma-separated)'
    required: false
    default: 'unit'
  python-gil:
    description: 'PYTHON_GIL value to export after activating the test environment'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Test defaults
      shell: bash --noprofile --norc -eo pipefail {0}
      run: |
        if [[ -n "${{ inputs.python-gil }}" ]]; then
          export PYTHON_GIL="${{ inputs.python-gil }}"
        fi
        pytest tests/test_defaults.py

    - name: Test cross
      shell: bash --noprofile --norc -eo pipefail {0}
      run: |
        if [[ -n "${{ inputs.python-gil }}" ]]; then
          export PYTHON_GIL="${{ inputs.python-gil }}"
        fi
        pytest tests/test_cross.py

    - name: Run tests
      if: success() || failure()
      shell: bash --noprofile --norc -eo pipefail {0}
      run: |
        if [[ -n "${{ inputs.python-gil }}" ]]; then
          export PYTHON_GIL="${{ inputs.python-gil }}"
        fi
        COLOR="--color=yes"
        COVERAGE="--cov=bokeh --cov-report=xml"
        POLICY="--last-failed --last-failed-no-failures none"
        pytest $COLOR $COVERAGE tests/unit -n logical || pytest $COLOR $POLICY tests/unit

    - name: Upload code coverage
      uses: codecov/codecov-action@v7
      if: success() || failure()
      with:
        env_vars: OS,PYTHON
        flags: ${{ inputs.coverage-flags }}
        verbose: true
