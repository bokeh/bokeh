name: 'Test Setup'

description: 'Perform Setup Steps for Bokeh CI Test Jobs'

inputs:
  environment:
    description: 'Pixi environment to install and activate'
    required: true
  update-packages:
    description: 'Space-separated Pixi packages to update before installing the Bokeh wheel'
    required: false
    default: ''
  source-tree:
    # string: "keep" or "delete"
    # (avoiding booleans: https://github.com/actions/runner/issues/1483)
    description: 'Whether to keep or delete the source tree'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.76.1
        environments: ${{ inputs.environment }}
        activate-environment: ${{ inputs.environment }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'branch-')) }}

    - name: Update selected packages
      if: ${{ inputs.update-packages != '' }}
      shell: bash --noprofile --norc -eo pipefail {0}
      env:
        PIXI_ENVIRONMENT: ${{ inputs.environment }}
        PIXI_UPDATE_PACKAGES: ${{ inputs.update-packages }}
      run: |
        read -r -a packages <<< "$PIXI_UPDATE_PACKAGES"
        pixi update --environment "$PIXI_ENVIRONMENT" "${packages[@]}"

    - name: Download wheel package
      id: download
      uses: actions/download-artifact@v8
      with:
        name: wheel-package
        path: dist/

    - name: Install wheel package
      shell: bash --noprofile --norc -eo pipefail {0}
      run: python -m pip install --no-deps dist/bokeh-*-py3-none-any.whl

    - name: Download bokehjs package
      uses: actions/download-artifact@v8
      with:
        name: bokehjs-package
        path: bokehjs/build/dist/

    - name: Symlink bokehjs package
      shell: bash --noprofile --norc -eo pipefail {0}
      working-directory: ./bokehjs/build/dist/
      run: ln -s $(ls -t bokeh-bokehjs-*.tgz | head -n 1) bokeh-bokehjs.tgz

    - name: Install node modules
      if: ${{ inputs.source-tree == 'keep' }}
      working-directory: ./bokehjs
      shell: bash --noprofile --norc -eo pipefail {0}
      run: npm ci --no-progress

    - name: Delete repository source tree
      if: ${{ inputs.source-tree == 'delete' }}
      shell: bash --noprofile --norc -eo pipefail {0}
      run: rm -rf src/bokeh
