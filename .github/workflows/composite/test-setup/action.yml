name: 'Test Setup'

description: 'Perform Setup Steps for Bokeh CI Test Jobs'

inputs:
  test-env:
    # string: "environment-test-{{ test-env }}.yml"
    description: 'Test environment file to use'
    required: true
  source-tree:
    # string: "keep" or "delete"
    # (avoiding booleans: https://github.com/actions/runner/issues/1483)
    description: 'Whether to keep or delete the source tree'
    required: true

runs:
  using: "composite"
  steps:
    # Build conda cache key (24-hour expiration via date)
    # To manually reset cache, increment the version number (v1, v2, etc.)
    # We cache the package directory (pkgs/) instead of individual environments
    # to allow sharing packages across different Python versions on the same OS.
    # This dramatically reduces cache size (3-6 GB total vs 10+ GB with per-env caching).
    - name: Build conda cache key
      id: conda-cache-key
      shell: bash
      run: |
        TODAY=$(date -u '+%Y%m%d')
        CACHE_KEY="conda-pkgs-v1-${{ runner.os }}-${{ runner.arch }}-${TODAY}"
        echo "key=${CACHE_KEY}" >> $GITHUB_OUTPUT

    # Cache conda packages (shared across all environments on this OS)
    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ steps.conda-cache-key.outputs.key }}
      id: cache

    # Remove nodejs from conda environment to avoid duplicate installation
    # We'll install Node.js via setup-node instead for better npm caching
    - name: Filter nodejs from environment file
      shell: bash
      run: |
        LOC="conda/environment-test-${{ inputs.test-env }}"
        grep -v '^\s*-\s*nodejs\b' $LOC.yml > $LOC-no-nodejs.yml

    # Setup Miniforge and create environment from filtered file
    # This creates and activates the bk-test environment with all packages
    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        mamba-version: "*"
        activate-environment: bk-test
        environment-file: conda/environment-test-${{ inputs.test-env }}-no-nodejs.yml
        conda-remove-defaults: true
        run-post: ${{ runner.os != 'Windows' }}

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'bokehjs/package-lock.json'

    - name: Download wheel package
      id: download
      uses: actions/download-artifact@v4
      with:
        name: wheel-package
        path: dist/

    - name: Install wheel package
      shell: bash -l {0}
      run: pip install dist/bokeh-*-py3-none-any.whl

    - name: Download bokehjs package
      uses: actions/download-artifact@v4
      with:
        name: bokehjs-package
        path: bokehjs/build/dist/

    - name: Symlink bokehjs package
      shell: bash -l {0}
      working-directory: ./bokehjs/build/dist/
      run: ln -s $(ls -t bokeh-bokehjs-*.tgz | head -n 1) bokeh-bokehjs.tgz

    - name: Upgrade npm
      shell: bash -l {0}
      run: |
        npm install --location=global npm

    - name: Install node modules
      if: ${{ inputs.source-tree == 'keep' }}
      shell: bash -l {0}
      run: bash scripts/ci/install_node_modules.sh

    - name: Delete repository source tree
      if: ${{ inputs.source-tree == 'delete' }}
      shell: bash -l {0}
      run: rm -rf src/bokeh
