name: Release - Deploy
run-name: Release - Deploy ${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy a release for (e.g. 3.0.0, 2.4.0.dev8)"
        required: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:

  preflight:
    runs-on: ubuntu-24.04
    environment:
      name: publish-anaconda
    permissions: {}

    steps:
      - name: Set up Anaconda CLI
        uses: anaconda/actions/setup-anaconda-cli@a6f488910b4a1e4f3fe01736241ca1b92b4b355a # v0.3.1
        with:
          version: v0.2.1
          tools: anaconda-cli

      - name: Validate Anaconda token
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if ! identity="$("$HOME/.ana/tools/anaconda-cli/bin/anaconda" -t "$ANACONDA_TOKEN" whoami 2>&1)"; then
            printf '%s\n' "$identity"
            echo "::error::Anaconda token authentication failed"
            exit 1
          fi
          if [[ "$identity" != *"Username: bokeh"* ]]; then
            printf '%s\n' "$identity"
            echo "::error::Anaconda token is not authenticated as bokeh"
            exit 1
          fi
          echo "Verified Anaconda credentials"

  prepare:
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: download-deployment
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check Maintainer
        uses: tspascoal/get-user-teams-membership@b2546c5affc730fd8e3d8483ae9ad3621938c2f9 # v4.0.2
        id: checkUserMember
        with:
          username: ${{ github.actor }}
          team: 'release-manager'
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Maintainer confirmed
        if: ${{ steps.checkUserMember.outputs.isTeamMember == 'true' }}
        env:
          BOKEH_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo
          echo "User is authorized to deploy releases, proceeding with release deploy for $BOKEH_VERSION"
          exit 0
      - name: Maintainer not detected
        if: ${{ steps.checkUserMember.outputs.isTeamMember == 'false' }}
        run: |
          echo
          echo "User is NOT authorized to deploy releases, aborting..."
          echo
          echo "Please contact @bokeh/core about conducting releases."
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.83.0
          environments: release-deploy
          activate-environment: release-deploy
          locked: true
          cache: false

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_DEPLOY_ROLE_ARN }}
          role-session-name: bokeh-release-prepare-${{ github.run_id }}
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Prepare Release Tarball
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          BOKEH_VERSION: ${{ github.event.inputs.version }}
        run: python -m tools.release prepare-deployment "$BOKEH_VERSION"

      - name: Upload documentation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docs-distribution
          path: deployment-${{ github.event.inputs.version }}/docs/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Conda distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: conda-distribution
          path: deployment-${{ github.event.inputs.version }}/bokeh-${{ github.event.inputs.version }}-py_0.tar.bz2
          if-no-files-found: error
          retention-days: 1

      - name: Upload npm distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-distribution
          path: deployment-${{ github.event.inputs.version }}/bokeh-*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Python distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pypi-distributions
          path: |
            deployment-${{ github.event.inputs.version }}/bokeh-${{ github.event.inputs.version }}.tar.gz
            deployment-${{ github.event.inputs.version }}/bokeh-${{ github.event.inputs.version }}-py3-none-any.whl
          if-no-files-found: error
          retention-days: 1

  publish-docs:
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: publish-docs
      url: https://docs.bokeh.org/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.83.0
          environments: release-deploy
          activate-environment: release-deploy
          locked: true
          cache: false

      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-distribution
          path: deployment-${{ github.event.inputs.version }}/docs/

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_DOCS_ROLE_ARN }}
          role-session-name: bokeh-release-docs-${{ github.run_id }}
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Publish documentation
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          BOKEH_VERSION: ${{ github.event.inputs.version }}
        run: python -m tools.release publish-docs "$BOKEH_VERSION"

  publish-conda:
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: publish-anaconda
      url: https://anaconda.org/bokeh/bokeh
    permissions: {}

    steps:
      - name: Download Conda distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda-distribution
          path: dist/

      - name: Publish Conda distribution
        uses: anaconda/actions/upload-package@a6f488910b4a1e4f3fe01736241ca1b92b4b355a # v0.3.1
        with:
          token: ${{ secrets.ANACONDA_TOKEN }}
          channel: bokeh
          packages: dist/bokeh-*.tar.bz2
          labels: ${{ contains(github.event.inputs.version, '.dev') && 'dev' || contains(github.event.inputs.version, 'rc') && 'rc,dev' || 'main,rc,dev' }}
          force: true

  publish-npm:
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: publish-npm
      url: https://www.npmjs.com/package/@bokeh/bokehjs
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download npm distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-distribution
          path: dist/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.22.1 <25'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm distribution
        working-directory: dist/
        env:
          NPM_TAG: ${{ (contains(github.event.inputs.version, '.dev') || contains(github.event.inputs.version, 'rc')) && 'dev' || 'latest' }}
        run: |
          for package in $(python ../tools/release/npm.py); do
            npm publish --access=public --tag="$NPM_TAG" "$package"-*.tgz
          done

  publish-pypi:
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: publish-pypi
      url: https://pypi.org/p/bokeh
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  finalize:
    if: ${{ always() }}
    needs: [preflight, publish-docs, publish-conda, publish-npm, publish-pypi]
    runs-on: ubuntu-24.04
    permissions: {}

    steps:
      - name: Confirm release deployment
        env:
          BOKEH_VERSION: ${{ github.event.inputs.version }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          DOCS_RESULT: ${{ needs.publish-docs.result }}
          CONDA_RESULT: ${{ needs.publish-conda.result }}
          NPM_RESULT: ${{ needs.publish-npm.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          if [[ "$PREFLIGHT_RESULT" != success || "$DOCS_RESULT" != success || "$CONDA_RESULT" != success || "$NPM_RESULT" != success || "$PYPI_RESULT" != success ]]; then
            echo "Release deployment failed: preflight=$PREFLIGHT_RESULT, docs=$DOCS_RESULT, conda=$CONDA_RESULT, npm=$NPM_RESULT, pypi=$PYPI_RESULT"
            exit 1
          fi
          echo "Successfully deployed Bokeh $BOKEH_VERSION"
