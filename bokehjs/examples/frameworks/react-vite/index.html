<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #243b53; background: #f3f6f8; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .app-shell { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
  .eyebrow { margin: 0 0 8px; color: #087f8c; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0; color: #102a43; font-size: clamp(2rem, 6vw, 3rem); }
  .intro, .note { color: #526d82; line-height: 1.6; }
  .demo-card { margin: 24px 0; padding: 20px; overflow: hidden; border: 1px solid #d9e2ec; border-radius: 12px; background: white; box-shadow: 0 10px 30px rgb(36 59 83 / 10%); }
  .control-row { display: grid; grid-template-columns: auto minmax(160px, 1fr) 4rem; gap: 16px; align-items: center; margin-bottom: 16px; }
  .control-row label { font-weight: 650; }
  .control-row input { width: 100%; accent-color: #087f8c; }
  .control-row output { text-align: right; font-variant-numeric: tabular-nums; }
  .plot-host { min-height: 300px; overflow-x: auto; }
  @media (max-width: 600px) {
    .app-shell { padding: 32px 16px; }
    .control-row { grid-template-columns: 1fr auto; }
    .control-row input { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
<title>BokehJS with React</title>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
